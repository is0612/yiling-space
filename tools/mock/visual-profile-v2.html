<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>形象档案 · 改版静态稿</title>
<style>
html{scrollbar-width:none}
::-webkit-scrollbar{width:0;height:0}
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f4f6f9; --surface:#fff; --surface-2:#f8f9fb; --surface-3:#f1f3f7;
  --line:#e6e9ef; --line-strong:#dbe0e9;
  --text:#101620; --text-2:#454f5e; --dim:#68717f; --faint:#9aa3b1;
  --brand:#d94a76; --brand-btn:#c9416b; --brand-btn-h:#b8375f; --brand-strong:#bf3a63;
  --brand-soft:#fdf0f4; --brand-line:#f6d3df;
  --green:#0b7a54; --green-soft:#e8f6f0; --amber:#8f5c05; --amber-soft:#fdf6e7; --amber-line:#ecd9b4;
  --red:#c92b41; --red-soft:#fdecee; --blue:#4c5fd5; --blue-soft:#eef0fd;
  --radius:10px; --radius-sm:8px; --radius-xs:6px;
  --sh-1:0 1px 2px rgba(16,24,40,.05);
  --side-w:260px; --topbar-h:56px;
}
body{background:#8f98a6;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;-webkit-font-smoothing:antialiased;color:var(--text);font-size:14px;line-height:1.6}
.frame{position:relative;width:1440px;height:900px;overflow:hidden;display:grid;grid-template-columns:var(--side-w) minmax(0,1fr);background:var(--bg)}

/* ───────── 侧栏 ───────── */
.sidebar{display:flex;flex-direction:column;background:var(--surface);padding:12px 10px 10px;overflow:hidden}
.sb-top{padding:2px 4px 10px}
.brand{display:flex;align-items:center;gap:9px}
.brand-mark{display:grid;width:30px;height:30px;place-items:center;border-radius:8px;background:linear-gradient(135deg,#ff8fae,#ef5f8b);color:#fff;font-size:15px;font-weight:700}
.brand-title{color:var(--text);font-size:15px;font-weight:700;letter-spacing:-.01em;line-height:1.2}
.brand-title span{color:var(--faint);font-size:12px;font-weight:600;letter-spacing:0}
.brand-sub{margin-top:1px;color:var(--faint);font-size:9px;font-weight:600;letter-spacing:.13em}
.sb-nav{display:flex;flex-direction:column;gap:1px;flex:1;min-height:0}
.sb-sec{display:flex;align-items:center;justify-content:space-between;padding:9px 10px 5px;color:var(--dim);font-size:12px;font-weight:600;letter-spacing:.02em}
.sb-sec svg{width:12px;height:12px;transform:rotate(90deg)}
.sb-link{display:flex;align-items:center;gap:9px;height:34px;border-radius:8px;padding:0 10px;color:var(--text-2);font-size:13.5px;font-weight:500}
.sb-link svg{flex:none;color:var(--faint);width:16px;height:16px}
.sb-link.active{background:var(--brand-soft);color:var(--brand-strong);font-weight:600}
.sb-link.active svg{color:var(--brand)}
.sb-bottom{flex:none;margin-top:8px;border-radius:10px;background:var(--surface-2);padding:7px 8px 4px}
.switcher{display:flex;align-items:center;gap:9px;padding:3px 2px}
.sw-ava{display:grid;width:30px;height:30px;flex:none;place-items:center;border-radius:999px;background:var(--brand-soft);color:var(--brand-strong);font-size:13px;font-weight:700}
.sw-name{color:var(--text);font-size:13px;font-weight:600;line-height:1.35}
.sw-note{color:var(--dim);font-size:12px;line-height:1.3}
.sw-arrow{margin-left:auto;color:var(--faint)}
.sb-ver{display:flex;justify-content:space-between;padding:8px 6px 2px;color:var(--faint);font-size:12px}

/* ───────── 顶栏 ───────── */
.main{display:flex;min-width:0;flex-direction:column;overflow:hidden}
.topbar{display:flex;min-height:var(--topbar-h);flex:none;align-items:center;gap:16px;background:var(--surface);padding:0 18px}
.tb-head{display:flex;min-width:0;flex:1;align-items:center;gap:8px}
.tb-crumb{color:var(--dim);font-size:14px}
.tb-sep{color:var(--faint);font-size:14px}
.tb-title{color:var(--text);font-size:18px;font-weight:700;letter-spacing:-.01em;line-height:1.2}
.tb-right{display:flex;align-items:center;gap:10px;margin-left:auto}
.tb-refresh{display:inline-flex;height:28px;align-items:center;gap:4px;border-radius:6px;background:var(--surface-2);padding:0 10px;color:var(--text-2);font-size:12px;font-weight:600}
.tb-refresh svg{width:13px;height:13px}
.env{display:inline-flex;align-items:center;gap:6px;border-radius:999px;background:var(--surface-2);padding:5px 9px;color:var(--dim);font-size:12px;white-space:nowrap}
.env i{width:6px;height:6px;border-radius:50%;background:var(--green)}
.pill{display:flex;height:32px;align-items:center;gap:8px;border-radius:999px;background:var(--surface-2);padding:0 10px 0 2px;color:var(--text-2);font-size:12px;font-weight:600}
.pill span.av{display:grid;width:28px;height:28px;place-items:center;border-radius:50%;background:var(--brand-soft);color:var(--brand-strong);font-size:12px;font-weight:700}
.tb-exit{display:inline-flex;align-items:center;gap:5px;color:var(--text-2);font-size:12px;font-weight:600}
.tb-exit svg{width:13px;height:13px}

/* ───────── 页面 ───────── */
.page{display:flex;flex:1;min-height:0;flex-direction:column;padding:20px 28px 24px;overflow:hidden}
.page-header{display:flex;flex:none;align-items:center;justify-content:space-between;gap:16px;margin-bottom:14px}
.hd-id{display:flex;align-items:center;gap:11px;min-width:0}
.hd-ava{display:grid;width:40px;height:40px;flex:none;place-items:center;border-radius:10px;background:linear-gradient(135deg,#eef0fd,#f6ecff);color:var(--brand-strong);font-size:17px;font-weight:700;border:1px solid var(--line)}
.hd-name{display:flex;align-items:center;gap:8px;color:var(--text);font-size:16px;font-weight:700;letter-spacing:-.01em;line-height:1.3}
.hd-sub{color:var(--dim);font-size:12px;line-height:1.4}
.hd-actions{display:flex;flex:none;align-items:center;gap:8px}
.draft-pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;background:var(--amber-soft);border:1px solid var(--amber-line);padding:4px 10px;color:var(--amber);font-size:12px;font-weight:600;white-space:nowrap}
.draft-pill i{width:6px;height:6px;border-radius:50%;background:var(--amber)}

.btn{display:inline-flex;height:32px;align-items:center;justify-content:center;gap:6px;border:1px solid transparent;border-radius:8px;background:transparent;padding:0 12px;color:var(--text-2);font-size:13px;font-weight:600;white-space:nowrap;cursor:pointer}
.btn svg{width:14px;height:14px}
.btn.primary{background:var(--brand-btn);color:#fff}
.btn.line{border-color:var(--line-strong);color:var(--text-2)}
.btn.sm{height:28px;padding:0 10px;font-size:12px;border-radius:7px}
.btn.sm svg{width:13px;height:13px}

/* 分区导航 */
.vp-nav{display:flex;flex:none;align-items:center;gap:4px;margin-bottom:16px;border-bottom:1px solid var(--line);padding-bottom:7px}
.vp-tab{display:inline-flex;align-items:center;gap:7px;height:34px;border-radius:8px;padding:0 13px;color:var(--dim);font-size:13.5px;font-weight:500;white-space:nowrap}
.vp-tab svg{width:15px;height:15px}
.vp-tab.active{background:var(--brand-soft);color:var(--brand-strong);font-weight:600}
.vp-tab .n{margin-left:1px;color:var(--faint);font-size:12px;font-weight:600}
.vp-tab.active .n{color:var(--brand)}

.vp-body{display:flex;flex:1;min-height:0;gap:14px;overflow:hidden}
.col{display:flex;min-width:0;flex-direction:column;gap:14px}
.col.grow{flex:1}
.col.side{flex:none;width:320px}

/* 卡片 */
.card{border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);box-shadow:var(--sh-1)}
.card-hd{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px 0}
.card-hd h3{color:var(--text);font-size:14px;font-weight:700;letter-spacing:-.01em}
.card-hd .hint{color:var(--dim);font-size:12px}
.card-bd{padding:12px 16px 16px}
.card-tools{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:9px}
.card-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;border-top:1px solid var(--line);padding:10px 16px}
.card.fill{display:flex;flex-direction:column}
.card.fill .card-bd{flex:1;display:flex;flex-direction:column;justify-content:space-between}

/* 文本层级 */
.ev-t{color:var(--text)}
.meta{color:var(--dim);font-size:12px;line-height:1.55}
.b-note{color:var(--dim);font-size:12px;line-height:1.7}

/* 文本域 */
.ta{border:1px solid var(--line-strong);border-radius:8px;background:var(--surface);padding:9px 11px;color:var(--text);font-size:13px;line-height:1.85;white-space:pre-wrap;overflow:hidden}
.ta.read{background:var(--surface-2);color:var(--text-2);border-color:var(--line)}
.ta.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;line-height:1.9}
.ta .ph{color:var(--faint)}

/* chips */
.chip{display:inline-flex;height:26px;align-items:center;gap:5px;border:1px solid var(--line);border-radius:999px;background:var(--surface);padding:0 10px;color:var(--text-2);font-size:12px;font-weight:500;white-space:nowrap}
.chip svg{width:12px;height:12px;color:var(--faint)}

/* 概览 */
.hero{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:18px;padding:16px 18px}
.hero-fig{width:88px;height:88px;flex:none;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:linear-gradient(135deg,#eef0fd,#f9f2ff)}
.hero-fig svg{display:block;width:100%;height:100%}
.hero-name{display:flex;align-items:center;gap:9px}
.hero-name strong{color:var(--text);font-size:18px;font-weight:700;letter-spacing:-.015em}
.tag{display:inline-flex;align-items:center;gap:4px;border-radius:5px;padding:2px 7px;font-size:11px;font-weight:600;line-height:1.5}
.tag.ok{background:var(--green-soft);color:var(--green)}
.tag.draft{background:var(--amber-soft);color:var(--amber)}
.tag.plain{background:var(--surface-3);color:var(--dim)}
.hero-meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;margin-top:7px;color:var(--dim);font-size:12px}
.hero-meta b{color:var(--text-2);font-weight:600;font-variant-numeric:tabular-nums}
.hero-kpis{display:flex;gap:0;flex:none}
.hero-kpi{padding:0 18px;border-left:1px solid var(--line);text-align:left}
.hero-kpi .k{color:var(--dim);font-size:12px}
.hero-kpi .v{margin-top:3px;color:var(--text);font-size:22px;font-weight:700;letter-spacing:-.02em;line-height:1.15;font-variant-numeric:tabular-nums}
.hero-kpi .v small{margin-left:3px;color:var(--dim);font-size:12px;font-weight:500;letter-spacing:0}

.check{display:flex;align-items:flex-start;gap:9px;padding:8px 0;border-bottom:1px dashed var(--line)}
.check:last-child{border-bottom:0;padding-bottom:0}
.check.first{padding-top:0}
.ck{display:grid;width:17px;height:17px;flex:none;margin-top:2px;place-items:center;border-radius:50%}
.ck svg{width:11px;height:11px}
.ck.on{background:var(--green-soft);color:var(--green)}
.ck.off{background:var(--surface-3);color:var(--faint)}
.check-t{color:var(--text);font-size:13px;font-weight:600;line-height:1.5}
.check-d{color:var(--dim);font-size:12px;line-height:1.5}
.check-a{margin-left:auto;flex:none;color:var(--brand-strong);font-size:12px;font-weight:600}

.pv{border-radius:8px;background:var(--surface-2);border:1px solid var(--line);padding:10px 12px;color:var(--text-2);font-size:12px;line-height:1.8}
.pv .k{display:block;margin-bottom:3px;color:var(--dim);font-size:12px;font-weight:600}
.pv + .pv{margin-top:9px}

/* 时间线 */
.tl{display:flex;align-items:flex-start;gap:0;overflow:hidden}
.tl-item{position:relative;flex:1;min-width:0;padding:0 14px 0 0}
.tl-dot{display:flex;align-items:center;gap:7px}
.tl-dot i{width:8px;height:8px;flex:none;border-radius:50%;background:var(--line-strong);box-shadow:0 0 0 3px #fff}
.tl-dot i.now{background:var(--green)}
.tl-dot i.draft{background:var(--amber)}
.tl-dot strong{color:var(--text);font-size:13px;font-weight:700}
.tl-line{position:absolute;top:4px;left:14px;right:4px;height:1px;background:var(--line)}
.tl-note{margin-top:7px;color:var(--text-2);font-size:12px;line-height:1.55}
.tl-time{margin-top:4px;color:var(--dim);font-size:12px}

/* 造型卡 */
.outfit{border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);box-shadow:var(--sh-1);padding:13px 15px 12px}
.outfit.is-on{border-color:var(--brand-line);background:#fffbfc}
.outfit-hd{display:flex;align-items:center;gap:8px}
.outfit-hd strong{color:var(--text);font-size:14px;font-weight:700}
.outfit-p{margin-top:7px;color:var(--text-2);font-size:12.5px;line-height:1.7;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.outfit-f{display:flex;align-items:center;gap:4px;margin-top:9px;padding-top:9px;border-top:1px solid var(--line)}
.outfit-f .sp{margin-left:auto}
.add-slot{display:grid;flex:1;min-height:0;place-content:center;justify-items:center;gap:5px;border:1px dashed var(--line-strong);border-radius:var(--radius);background:var(--surface-2);padding:22px 14px;color:var(--dim)}
.add-slot svg{width:18px;height:18px;color:var(--faint)}
.add-slot strong{color:var(--text-2);font-size:13.5px;font-weight:600}
.add-ico{display:grid;width:36px;height:36px;flex:none;place-items:center;border-radius:999px;background:#fff;border:1px solid var(--brand-line);color:var(--brand-strong);box-shadow:0 1px 3px rgba(217,74,118,.14)}
.add-ico svg{width:16px;height:16px;color:var(--brand-strong)}
.add-tips{margin:8px 0 0;padding:0;list-style:none;display:grid;gap:5px;text-align:left}
.add-tips li{position:relative;padding-left:12px;color:var(--dim);font-size:12px;line-height:1.6}
.add-tips li::before{content:"";position:absolute;left:2px;top:8px;width:3px;height:3px;border-radius:50%;background:var(--faint)}
.add-slot span{color:var(--dim);font-size:12px}

/* 表单 */
.field + .field{margin-top:12px}
.field-l{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
.field-l span{color:var(--text-2);font-size:12.5px;font-weight:600}
.field-l em{color:var(--dim);font-size:12px;font-style:normal;font-variant-numeric:tabular-nums}
.inp{display:flex;height:32px;align-items:center;border:1px solid var(--line-strong);border-radius:8px;background:var(--surface);padding:0 11px;color:var(--text);font-size:13px}
.inp .ph{color:var(--faint)}

/* 上传区 */
.dz{display:flex;flex:none;align-items:center;gap:14px;border:1.5px dashed var(--line-strong);border-radius:var(--radius);background:var(--surface);padding:16px 18px}
.dz-ico{display:grid;width:42px;height:42px;flex:none;place-items:center;border-radius:10px;background:var(--brand-soft);color:var(--brand-strong)}
.dz-ico svg{width:20px;height:20px}
.dz-t{color:var(--text);font-size:13.5px;font-weight:600}
.dz-t b{color:var(--brand-strong);font-weight:600}
.dz-d{margin-top:3px;color:var(--dim);font-size:12px}
.dz-right{margin-left:auto;display:flex;align-items:center;gap:8px}

/* 素材组 */
.asset-group{margin-top:14px}
.ag-hd{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.ag-hd strong{color:var(--text);font-size:13px;font-weight:700}
.ag-hd .cnt{color:var(--dim);font-size:12px;font-weight:600}
.ag-hd .rule{flex:1;height:1px;background:var(--line)}
.ag-hd .more{color:var(--brand-strong);font-size:12px;font-weight:600}
.ag-row{display:flex;flex-wrap:wrap;gap:10px}
.asset{width:150px;border:1px solid var(--line);border-radius:8px;background:var(--surface);overflow:hidden}
.asset-img{position:relative;width:148px;height:104px;background:linear-gradient(135deg,#eef0fd,#f9f2ff)}
.asset-img svg{display:block;width:100%;height:100%}
.asset-img .del{position:absolute;top:5px;right:5px;display:grid;width:21px;height:21px;place-items:center;border-radius:5px;background:rgba(255,255,255,.92);color:var(--red);box-shadow:var(--sh-1)}
.asset-img .del svg{width:12px;height:12px}
.asset-m{padding:6px 8px 7px}
.asset-m strong{display:block;overflow:hidden;color:var(--text);font-size:12px;font-weight:600;text-overflow:ellipsis;white-space:nowrap;line-height:1.45}
.asset-m span{display:block;margin-top:1px;color:var(--dim);font-size:11px;line-height:1.4}
.asset.plus{border-style:dashed;background:var(--surface-2)}
.asset.plus .asset-img{display:grid;place-items:center;background:transparent;height:104px;color:var(--faint)}
.asset.plus .asset-img svg{width:18px;height:18px}

/* 右栏 sticky 卡 */
.side-card{position:sticky;top:0}
.flow{display:flex;flex-wrap:wrap;align-items:center;gap:7px}
.step{border:1px solid var(--line);border-radius:6px;background:var(--surface-2);padding:5px 9px;color:var(--text-2);font-size:12px;font-weight:600;white-space:nowrap}
.arr{color:var(--faint);font-size:12px}
.form-bar{display:flex;align-items:center;gap:10px;margin-top:auto;border-top:1px solid var(--line);padding-top:14px}

/* 版本历史 */
.ver{display:flex;align-items:flex-start;gap:12px;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);box-shadow:var(--sh-1);padding:12px 15px}
.ver.now{border-color:var(--green);background:#fbfefc}
.ver.draft{border-color:var(--amber-line);background:#fffdf8}
.ver-no{display:grid;width:30px;height:30px;flex:none;place-items:center;border-radius:8px;background:var(--surface-3);color:var(--text-2);font-size:12px;font-weight:700;font-variant-numeric:tabular-nums}
.ver.now .ver-no{background:var(--green-soft);color:var(--green)}
.ver.draft .ver-no{background:var(--amber-soft);color:var(--amber)}
.ver-b{flex:1;min-width:0}
.ver-t{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ver-t strong{color:var(--text);font-size:13.5px;font-weight:700}
.ver-n{margin-top:4px;color:var(--text-2);font-size:12.5px;line-height:1.6}
.ver-m{display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px;margin-top:6px;color:var(--dim);font-size:12px}
.ver-a{display:flex;flex:none;flex-direction:column;gap:4px;align-items:flex-end}
.filter{display:flex;align-items:center;gap:6px;margin-bottom:12px}
.fchip{display:inline-flex;height:28px;align-items:center;border:1px solid var(--line);border-radius:999px;background:var(--surface);padding:0 12px;color:var(--text-2);font-size:12px;font-weight:600}
.fchip.on{border-color:var(--text);background:var(--text);color:#fff}
.diff{border:1px solid var(--line);border-radius:8px;overflow:hidden;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11.5px;line-height:1.75}
.diff div{padding:3px 10px;white-space:pre-wrap;overflow-wrap:anywhere}
.diff .add{background:#f2fbf6;color:#0b6b4a}
.diff .del{background:#fdf1f3;color:#9c2334}
.diff .same{color:var(--dim)}
.diff-row{display:flex;align-items:flex-start;gap:8px;padding:8px 0;border-bottom:1px dashed var(--line)}
.diff-row:last-child{border-bottom:0}
.diff-row .n{display:grid;width:16px;height:16px;flex:none;margin-top:2px;place-items:center;border-radius:4px;background:var(--brand-soft);color:var(--brand-strong);font-size:10px;font-weight:700}
.diff-row .t{color:var(--text);font-size:12.5px;font-weight:600;line-height:1.5}
.diff-row .d{color:var(--dim);font-size:12px;line-height:1.5}
.ghost-lbl{color:var(--dim);font-size:12px;font-weight:600}
</style>
</head>
<body>
<div id="root"></div>
<script>
const P = {
  grid:'<rect x="3" y="3" width="7" height="7" rx="1.6"/><rect x="14" y="3" width="7" height="7" rx="1.6"/><rect x="3" y="14" width="7" height="7" rx="1.6"/><rect x="14" y="14" width="7" height="7" rx="1.6"/>',

    <path d="M65.5 40c4.5 14 3.5 29-1 38 6-9 7-27 1-38Z" fill="url(#h-${uid})"/>`;

    <path d="M34 43C34 27 41 22 50 22c9 0 16 5 16 21 0-11-6-15-16-15s-16 4-16 15Z" fill="url(#h-${uid})"/>`;
